name: Weather Historical Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: weather-full-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    # Explicit handoff is required. A merge alone cannot start another importer.
    if: github.ref == 'refs/heads/main' && vars.WEATHER_BACKFILL_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PAVLOV_BYPASS_CONFIG: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      WEATHER_BACKFILL_EXECUTOR: github_actions
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/weather_backfill_requirements.txt
      - name: Install offline research dependencies
        run: python -m pip install -r scripts/weather_backfill_requirements.txt
      - name: Continue the single owned checkpoint and retest only when complete
        run: python -m scripts.run_weather_hosted_backfill --repo "$GITHUB_REPOSITORY"
