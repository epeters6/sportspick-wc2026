name: CLV Checkpoints

# Primary observer for forward-weather CLV using unsigned public venue books.
# Supabase's edge observer is reserved for legacy rows without experiment_id.

on:
  schedule:
    # Fallback only; Supabase is the primary timed dispatcher (see ops runbook).
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: 'UTC dispatch time from Supabase; leave blank for a manual run'
        required: false
        type: string

permissions:
  contents: read

jobs:
  clv:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: clv-checkpoints
      cancel-in-progress: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_ENV: production
      LOG_LEVEL: INFO
      GITHUB_ACTIONS: "true"
      # Public quote clients share legacy package imports but need no bot/signing keys.
      PYTHONPATH: ${{ github.workspace }}/pavlov:${{ github.workspace }}
      PAVLOV_BYPASS_CONFIG: "1"
      MODE: shadow
      LIVE_TRADING_ENABLED: "false"
      POLYMARKET_LIVE_ENABLED: "false"
      AUTO_BET_ENABLED: "0"
      POLY_AUTO_BET_ENABLED: "0"
      POLY_MLB_AUTO_BET_ENABLED: "0"
      DISCORD_WEBHOOK_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pavlov/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r pavlov/requirements.txt

      - name: Validate Supabase secrets
        run: python scripts/ci_check_env.py

      - name: Validate public weather quote client startup
        run: python -c "from pavlov.pipeline import kalshi_client; from pavlov.polymarket import poly_client"

      - name: Reject a queued trigger older than five minutes
        id: dispatch
        env:
          WEATHER_SCHEDULED_FOR: ${{ inputs.scheduled_for }}
        run: python scripts/check_weather_dispatch.py clv

      - name: Update CLV checkpoints (once)
        if: steps.dispatch.outputs.execute == 'true'
        run: python scripts/run_clv_scheduler.py --once
