name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep live trading locks off in CI test runs
      LIVE_TRADING_ENABLED: "false"
      POLYMARKET_LIVE_ENABLED: "false"
      AUTO_BET_ENABLED: "0"
      POLY_AUTO_BET_ENABLED: "0"
      POLY_MLB_AUTO_BET_ENABLED: "0"
      MODE: shadow
      # Dummy values so import-time settings resolve without real secrets
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
      SUPABASE_ANON_KEY: "test-anon-key-not-real"
      PAVLOV_BYPASS_CONFIG: "1"
      # Never run external scrape integration in unit CI
      RUN_EXTERNAL_SYNC_INTEGRATION: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pavlov/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r pavlov/requirements.txt

      - name: Run backend unit tests
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

  frontend-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Check all dashboard types
        run: npx tsc --noEmit --incremental false

  edge-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify legacy observer leaves experiment rows untouched
        run: node --test supabase/functions/clv-checkpoints/ownership.test.mjs

  scheduler-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix reports/weather-dispatch-sql-check --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.5.8
      - name: Verify dispatch SQL without connecting to production
        run: node supabase/ops/test_weather_dispatch_local.mjs reports/weather-dispatch-sql-check
