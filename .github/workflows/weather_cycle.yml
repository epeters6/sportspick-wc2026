name: Weather Paper Research

on:
  schedule:
    # Fallback only; Supabase is the primary timed dispatcher (see ops runbook).
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: 'UTC dispatch time from Supabase; leave blank for a manual run'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weather-paper-research
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      APP_ENV: production
      LOG_LEVEL: INFO
      GITHUB_ACTIONS: "true"
      MODE: shadow
      LIVE_TRADING_ENABLED: "false"
      POLYMARKET_LIVE_ENABLED: "false"
      AUTO_BET_ENABLED: "0"
      POLY_AUTO_BET_ENABLED: "0"
      POLY_MLB_AUTO_BET_ENABLED: "0"
      POLY_MLB_INGAME_ENABLED: "0"
      DISCORD_WEBHOOK_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pavlov/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r pavlov/requirements.txt

      - name: Validate Supabase configuration
        run: python scripts/ci_check_env.py

      - name: Require a current trigger with enough time before the UTC boundary
        id: dispatch
        env:
          WEATHER_SCHEDULED_FOR: ${{ inputs.scheduled_for }}
        run: python scripts/check_weather_dispatch.py weather

      # The orchestrator isolates forecast failures from settlement and reporting.
      - name: Settle, forecast, evaluate, and report weather paper experiment
        if: steps.dispatch.outputs.execute == 'true'
        run: python -m scripts.run_weather_cycle --report reports/weather/latest.json

      - name: Upload weather evidence even when a stage fails
        if: always() && steps.dispatch.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weather-paper-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            reports/weather/**
            weather_shadow_decisions.jsonl
            weather_sync_status.json
            orderbook_snapshots.jsonl
